name: Containers
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  step-container:
    runs-on: ubuntu-latest
    steps:
      - name: On the runner
        run: cat /etc/os-release

      - name: In an Alpine container
        uses: docker://alpine:3.22
        with:
          entrypoint: /bin/sh
          args: -c "cat /etc/os-release"
